<title>Japon 21 jours · 8–28 juin</title>
<style>
:root {
  --bg:#fff7f8; --panel:#ffffff; --card:#fff1f4; --soft:#f8c7d0; --text:#2b0f14; --muted:#6b4b52;
  --accent:#d90429; --accent2:#f8a8b8; --sakura:#ffd7df; --ok:#16a34a; --line:rgba(120,18,34,.14);
  --shadow: 0 18px 45px rgba(160, 28, 48, .14);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at top left, rgba(217,4,41,.12), transparent 34%),radial-gradient(circle at top right, rgba(255,183,197,.34), transparent 30%),linear-gradient(180deg,#fff7f8 0%, #ffffff 48%, #fff1f4 100%);color:var(--text);}
a{color:inherit;text-decoration:none}
button{font:inherit}
.app{max-width:1180px;margin:0 auto;padding:18px 14px 90px}
.hero{position:relative;z-index:20;margin:-18px -14px 12px;padding:18px 14px 12px;background:linear-gradient(180deg, rgba(255,247,248,.98), rgba(255,247,248,.90));border-bottom:1px solid var(--line)}
.heroTop{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#d90429;font-weight:800}
h1{font-size:28px;line-height:1.05;margin:5px 0 6px}
.subtitle{color:var(--muted);font-size:14px;line-height:1.45;max-width:780px}
.pillrow{display:flex;gap:8px;overflow:auto;padding:11px 0 2px;scrollbar-width:none}
.pillrow::-webkit-scrollbar{display:none}
.pill{border:1px solid var(--line);background:rgba(255,255,255,.78);color:var(--text);border-radius:999px;padding:8px 11px;white-space:nowrap;font-size:13px;cursor:pointer}
.pill.active{background:linear-gradient(135deg,var(--accent),#ff6f91);border-color:transparent;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}
.stat{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:16px;padding:10px}
.stat b{display:block;font-size:18px}
.stat span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.dayCard{display:none;background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;margin-top:14px}
.dayCard.active{display:block;animation:fade .2s ease-out}
@keyframes fade{from{opacity:.4;transform:translateY(5px)}to{opacity:1;transform:none}}
.dayHead{padding:18px;background:linear-gradient(135deg,rgba(217,4,41,.11),rgba(255,215,223,.75));border-bottom:1px solid var(--line)}
.dayTitle{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.dayTitle h2{margin:0;font-size:24px}
.city{color:#a70d24;font-weight:800;margin-top:4px}
.summary{color:var(--muted);line-height:1.5;margin:12px 0 0}
.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:12px;padding:14px}
.section{background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:20px;padding:14px}
.section h3{margin:0 0 10px;font-size:17px;display:flex;align-items:center;gap:8px}
.hotelBox{display:grid;gap:8px}
.hotelName{font-weight:900;font-size:18px}
.meta{color:var(--muted);font-size:13px;line-height:1.4}
.list{display:grid;gap:10px}
.item{display:grid;grid-template-columns:28px 1fr;gap:9px;padding:10px;border-radius:16px;background:rgba(255,247,248,.88);border:1px solid rgba(255,255,255,.07)}
.check{width:24px;height:24px;border-radius:8px;border:1px solid var(--soft);display:grid;place-items:center;cursor:pointer;background:rgba(255,255,255,.04);color:transparent;user-select:none}
.item.done{opacity:.58}
.item.done .check{background:var(--ok);color:white;border-color:var(--ok)}
.item.done .ititle{text-decoration:line-through}
.ititle{font-weight:850;line-height:1.25}
.idesc{color:var(--muted);font-size:13px;line-height:1.45;margin:5px 0 8px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11px;border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:999px;padding:4px 7px;color:#6b4b52}
.map{display:inline-flex;align-items:center;gap:5px;background:rgba(217,4,41,.10);border:1px solid rgba(217,4,41,.25);color:#a70d24;border-radius:999px;padding:5px 8px;font-size:12px;font-weight:800;margin-top:8px}
.transport{padding:0 14px 14px}
.note{background:rgba(245,158,11,.10);border:1px solid rgba(245,158,11,.28);border-radius:18px;padding:12px;color:#a70d24;line-height:1.45;font-size:14px}
.footerNav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,247,248,.94);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:9px 12px calc(9px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center}
.navBtn,.resetBtn{border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--text);border-radius:14px;padding:10px 12px;font-weight:800;cursor:pointer}
.navBtn.primary{background:linear-gradient(135deg,var(--accent),#ff6f91);border-color:transparent}
.overview{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.mini{background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:18px;padding:12px}
.mini b{display:block;margin-bottom:4px}
.mini small{color:var(--muted);line-height:1.4}
.searchbar{display:flex;gap:8px;margin-top:10px}
.searchbar input{width:100%;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.07);color:var(--text);padding:11px 12px;outline:none}
.searchbar input::placeholder{color:#94a3b8}
.routeBox{display:grid;gap:8px}
.routeLine{display:flex;gap:8px;align-items:flex-start;color:var(--muted);font-size:13px;line-height:1.45}
.routeLine b{min-width:78px;color:var(--accent)}
.routePrice{display:inline-flex;align-items:center;gap:6px;background:rgba(217,4,41,.10);border:1px solid rgba(217,4,41,.22);border-radius:999px;padding:6px 9px;font-weight:900;color:#a70d24}

/* Fond sakura discret, inspiré des branches de cerisiers japonais */
.sakura-bg{
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  overflow:hidden;
}
.sakura-branch{
  position:absolute;
  height:auto;
  opacity:.95;
}
.sakura-branch-top{
  top:70px;
  right:-110px;
  width:min(760px, 78vw);
}
.sakura-branch-bottom{
  left:-115px;
  bottom:42px;
  width:min(640px, 72vw);
  opacity:.72;
}
.blossom{
  transform-box:fill-box;
  transform-origin:center;
}
@media(max-width:820px){
  .sakura-branch-top{
    top:138px;
    right:-185px;
    width:560px;
    opacity:.88;
  }
  .sakura-branch-bottom{
    left:-220px;
    bottom:92px;
    width:500px;
    opacity:.55;
  }
}

/* Budget manuel par jour */
.budgetInputWrap{
  display:grid;
  gap:10px;
}
.budgetFields{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
  align-items:center;
}
.budgetFields input{
  width:100%;
  border:1px solid var(--line);
  border-radius:14px;
  background:rgba(255,255,255,.86);
  color:var(--text);
  padding:12px 13px;
  font-size:16px;
  outline:none;
}
.budgetFields button{
  border:0;
  border-radius:14px;
  padding:12px 14px;
  background:linear-gradient(135deg,var(--accent),#ff6f91);
  color:white;
  font-weight:900;
  cursor:pointer;
}
.budgetSaved{
  background:rgba(217,4,41,.08);
  border:1px solid rgba(217,4,41,.18);
  border-radius:16px;
  padding:10px 12px;
  color:#6b1020;
  font-weight:800;
}
.budgetSaved small{
  display:block;
  margin-top:3px;
  color:var(--muted);
  font-weight:600;
}

@media(max-width:820px){
  h1{font-size:23px}
  .grid{grid-template-columns:1fr;padding:10px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .dayHead{padding:14px}
  .section{padding:12px}
  .heroTop{display:block}
  .overview{grid-template-columns:1fr}
}
@media print{
  .hero,.footerNav,.check,.resetBtn{display:none!important}
  body{background:#fff;color:#000}
  .dayCard{display:block;box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .grid{grid-template-columns:1fr 1fr}
}

/* Optimisation mobile : l'entête défile avec la page et prend moins de hauteur */
@media(max-width:820px){
  .hero{position:relative!important;margin:-18px -14px 8px;padding:14px 12px 8px}
  .heroTop{display:block}
  h1{font-size:21px;margin:3px 0 4px}
  .subtitle{font-size:12px;line-height:1.35}
  .stats{grid-template-columns:repeat(2,1fr)!important;gap:6px;margin:8px 0}
  .stat{padding:7px 8px;border-radius:13px}
  .stat b{font-size:15px}
  .stat span{font-size:10.5px}
  .searchbar{margin-top:6px}
  .searchbar input{padding:9px 10px;font-size:13px}
  .pillrow{padding:7px 0 1px}
  .pill{padding:7px 9px;font-size:12px}
  .dayCard{margin-top:8px}
  .dayHead{padding:12px}
  .dayTitle h2{font-size:20px}
  .summary{font-size:13px;line-height:1.4;margin-top:8px}
}

</style>
</head>

let current = Number(localStorage.getItem("japan-current-day") || 1);
let query = "";

function key(day, type, idx) { return `jp-2026-${day}-${type}-${idx}`; }
function isDone(day, type, idx) { return localStorage.getItem(key(day,type,idx)) === "1"; }
function toggle(day, type, idx) {
  const k = key(day,type,idx);
  localStorage.setItem(k, localStorage.getItem(k)==="1" ? "0" : "1");
  renderDay(day);
  updateStats();
}
function doneCount() {
  let total=0, done=0;
  TRIP.forEach(d => ["activities","food","secrets"].forEach(t => d[t].forEach((_,i)=>{total++; if(isDone(d.day,t,i)) done++;})));
  return {total, done};
}
function link(url,label="Maps") { return `<a class="map" target="_blank" rel="noopener" href="${url}">📍 ${label}</a>`; }

function renderItem(obj, day, type, idx) {
  const done = isDone(day,type,idx);
  return `<div class="item ${done?'done':''}">
    <div class="check" onclick="toggle(${day},'${type}',${idx})">✓</div>
    <div>
      <div class="ititle">${obj.title}</div>
      <div class="idesc">${obj.desc}</div>
      <div class="tags">
        <span class="tag">${obj.tag || type}</span>
        <span class="tag">${obj.area || ''}</span>
        <span class="tag">${obj.budget || ''}</span>
        ${obj.intensity ? `<span class="tag">${obj.intensity}</span>` : ""}
      </div>
      ${link(obj.maps)}
    </div>
  </div>`;
}
function renderDay(n) {
  current = Math.max(1, Math.min(TRIP.length, n));
  localStorage.setItem("japan-current-day", current);
  document.querySelectorAll(".pill").forEach(p => p.classList.toggle("active", Number(p.dataset.day)===current));
  document.querySelectorAll(".dayCard").forEach(c => c.classList.toggle("active", Number(c.dataset.day)===current));
  refreshBudget(current);
  window.scrollTo({top:0, behavior:"smooth"});
}

function routeBox(d) {
  if(!d.route) return "";
  return `<section class="section" style="grid-column:1/-1">
    <h3>🚅 Grand trajet du jour</h3>
    <div class="routeBox">
      <div class="hotelName">${d.route.title}</div>
      <div class="routeLine"><b>Meilleur plan</b><span>${d.route.best}</span></div>
      <div class="routeLine"><b>Durée</b><span>${d.route.time}</span></div>
      <div class="routeLine"><b>Prix</b><span class="routePrice">${d.route.price}</span></div>
      <div class="routeLine"><b>Conseil</b><span>${d.route.tip}</span></div>
      ${link(d.route.maps, "Voir le trajet")}
    </div>
  </section>`;
}


function budgetKey(day) { return `jp-2026-budget-${day}`; }
function saveBudget(day) {
  const input = document.getElementById(`budget-input-${day}`);
  if(!input) return;
  const val = input.value.trim().replace(",", ".");
  if(val === "") {
    localStorage.removeItem(budgetKey(day));
  } else {
    localStorage.setItem(budgetKey(day), val);
  }
  refreshBudget(day);
  updateStats();
}
function getBudget(day) {
  return localStorage.getItem(budgetKey(day)) || "";
}
function refreshBudget(day) {
  const saved = getBudget(day);
  const box = document.getElementById(`budget-saved-${day}`);
  if(box) {
    box.innerHTML = saved
      ? `Total enregistré : ${Number(saved).toLocaleString("fr-BE", {maximumFractionDigits:2})} € <small>Ce montant reste sauvegardé sur ce téléphone/navigateur.</small>`
      : `Aucun montant enregistré <small>Entre le total réel de votre journée, par exemple 357 ou 522.</small>`;
  }
}
function budgetBox(d) {
  const saved = getBudget(d.day);
  return `<section class="section" style="grid-column:1/-1">
    <h3>💶 Budget réel du jour</h3>
    <div class="budgetInputWrap">
      <div class="meta">Inscris ici ce que cette journée vous a réellement coûté. Tu peux inclure manuellement le prix de l’hôtel du jour si tu veux que le total général reprenne tout.</div>
      <div class="budgetFields">
        <input id="budget-input-${d.day}" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Exemple : 357" value="${saved}" onkeydown="if(event.key==='Enter') saveBudget(${d.day})">
        <button onclick="saveBudget(${d.day})">Enregistrer</button>
      </div>
      <div class="budgetSaved" id="budget-saved-${d.day}">
        ${saved ? `Total enregistré : ${Number(saved).toLocaleString("fr-BE", {maximumFractionDigits:2})} € <small>Ce montant reste sauvegardé sur ce téléphone/navigateur.</small>` : `Aucun montant enregistré <small>Entre le total réel de votre journée, par exemple 357 ou 522.</small>`}
      </div>
    </div>
  </section>`;
}
function budgetTotal() {
  return TRIP.reduce((sum,d) => {
    const v = parseFloat(getBudget(d.day));
    return sum + (isNaN(v) ? 0 : v);
  }, 0);
}

function dayCard(d) {
  return `<article class="dayCard" data-day="${d.day}">
    <div class="dayHead">
      <div class="dayTitle">
        <div>
          <h2>Jour ${d.day} · ${d.date}</h2>
          <div class="city">${d.city}</div>
        </div>
        <div class="tag">${d.budget}</div>
      </div>
      <p class="summary">${d.summary}</p>
    </div>
    <div class="grid">
      <section class="section">
        <h3>🏨 Hôtel du soir</h3>
        <div class="hotelBox">
          <div class="hotelName">${d.hotel.name}</div>
          <div class="meta">${d.hotel.city}<br>${d.hotel.price}</div>
          ${link(d.hotel.maps, "Ouvrir l'hôtel")}
        </div>
      </section>
      <section class="section">
        <h3>🚆 Transport / logique du jour</h3>
        <div class="meta">${d.transport}</div>
      </section>
      ${routeBox(d)}
      <section class="section">
        <h3>🎯 Activités</h3>
        <div class="list">${d.activities.map((x,i)=>renderItem(x,d.day,"activities",i)).join("")}</div>
      </section>
      <section class="section">
        <h3>🍜 Restaurants & snacks</h3>
        <div class="list">${d.food.map((x,i)=>renderItem(x,d.day,"food",i)).join("")}</div>
      </section>
      <section class="section" style="grid-column:1/-1">
        <h3>💎 Bonus secrets / regard local</h3>
        <div class="list">${d.secrets.map((x,i)=>renderItem(x,d.day,"secrets",i)).join("")}</div>
      </section>
      ${budgetBox(d)}
    </div>
    <div class="transport"><div class="note">💡 Conseil : les liens Maps ouvrent Google Maps. L’app fonctionne hors ligne une fois chargée, mais Maps nécessite Internet.</div></div>
  </article>`;
}
function updateStats() {
  const c = doneCount();
  const el = document.getElementById("progressStat");
  if(el) el.innerHTML = `<b>${c.done}/${c.total}</b><span>éléments cochés</span>`;
  const bt = document.getElementById("budgetTotalStat");
  if(bt) bt.innerHTML = `<b>${budgetTotal().toLocaleString("fr-BE", {maximumFractionDigits:2})} €</b><span>budget réel + hôtels</span>`;
}
function build() {
  const app = document.getElementById("app");
  app.innerHTML = `
  <header class="hero">
    <div class="heroTop">
      <div>
        <div class="kicker">🇯🇵 Carnet interactif offline</div>
        <h1>Japon · 8 → 28 juin</h1>
        <div class="subtitle">Itinéraire jour par jour avec hôtels déjà payés, activités, restaurants, coins cachés, spots photo, budget et liens Google Maps.</div>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><b>21</b><span>jours</span></div>
      <div class="stat"><b>8</b><span>hôtels / étapes</span></div>
      <div class="stat"><b>±¥70k–90k<br><small>≈378–486 €</small></b><span>transports / pers.</span></div>
      <div class="stat" id="budgetTotalStat"><b>0 €</b><span>budget réel + hôtels</span></div>
      <div class="stat" id="progressStat"><b>0/0</b><span>éléments cochés</span></div>
    </div>
    <div class="searchbar"><input id="search" placeholder="Rechercher : sushi, temple, Tokyo, snack..." oninput="filterDays(this.value)"></div>
    <nav class="pillrow">${TRIP.map(d=>`<button class="pill" data-day="${d.day}" onclick="renderDay(${d.day})">J${d.day} · ${d.date}</button>`).join("")}</nav>
  </header>
  <section class="overview">
    <div class="mini"><b>🧭 Logique du voyage</b><small>Tokyo léger à l’arrivée, Kyoto culturel, Osaka food, Hiroshima/Miyajima émotion + ryokan, Kanazawa raffiné, Hakone onsen, retour Tokyo shopping et derniers souvenirs.</small></div>
    <div class="mini"><b>🎒 Astuce bagages</b><small>Le jour Kanazawa → Hakone, envisager le takkyubin vers Tokyo pour ne garder qu’un petit sac au ryokan.</small></div>
    <div class="mini"><b>🚅 Budget transport</b><small>Estimation grands trajets : ±¥70 000 par personne, soit environ 378 €, hors petits métros quotidiens. Avec métros/bus urbains et aéroports, prévoir plutôt ±¥85 000–95 000 par personne, soit environ 459–513 €.</small></div>
    <div class="mini"><b>🎫 JR Pass ?</b><small>Le 14 jours Ordinary est à ¥80 000, soit environ 432 €. Il peut être limite/rentable selon vos trajets exacts, mais les billets simples gardent plus de flexibilité.</small></div>
  </section>
  <main id="days">${TRIP.map(dayCard).join("")}</main>`;
  renderDay(current);
  updateStats();
}
function filterDays(val) {
  query = val.trim().toLowerCase();
  if(!query) return;
  const found = TRIP.find(d => JSON.stringify(d).toLowerCase().includes(query));
  if(found) renderDay(found.day);
}
function nextDay() { renderDay(current+1); }
function prevDay() { renderDay(current-1); }
function resetProgress() {
  if(!confirm("Tout décocher ?")) return;
  Object.keys(localStorage).filter(k=>k.startsWith("jp-2026-")).forEach(k=>localStorage.removeItem(k));
  build();
}
build();
</script>
</body>
</html>
